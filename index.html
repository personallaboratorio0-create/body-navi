const LS={
  load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}},
  save(k,v){
    try{
      const str=JSON.stringify(v);
      localStorage.setItem(k,str);
      // 写真データは大きすぎるので別途圧縮保存
    }catch(e){
      // localStorage容量超過の場合、写真なしで保存
      if(e.name==='QuotaExceededError'||e.code===22){
        try{
          // 写真データを除いて保存
          if(k==='bn_days'){
            const slim=JSON.parse(JSON.stringify(v));
            Object.values(slim).forEach(d=>{
              if(d.meals)d.meals=d.meals.map(m=>({...m,photo:null}));
            });
            localStorage.setItem(k,JSON.stringify(slim));
          }
        }catch(e2){console.error('Storage failed',e2);}
      }
    }
  }
};

const dk=(()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;})();

function findFood(q){
  q=String(q||"").trim();if(!q)return null;
  let best=null,bestScore=-1;
  FOOD_DB.forEach(f=>{
    [f.n,...(f.keys||[])].forEach(nm=>{
      if(!nm)return;
      let sc=-1;
      if(q===nm)sc=1000+nm.length;
      else if(q.includes(nm))sc=100+nm.length;
      else if(nm.includes(q))sc=50-nm.length;
      if(sc>bestScore){bestScore=sc;best=f;}
    });
  });
  return best;
}

// メニュー名テキストを内蔵DBで解析して明細と合計を返す
function parseMeal(text){
  const parts=String(text||"").split(/[、,・\n]+/).map(x=>x.trim()).filter(Boolean);
  const items=[],unknown=[];
  parts.forEach(part=>{
    const f=findFood(part);
    if(!f){unknown.push(part);return;}
    let mult=1;
    const gm=part.match(/(\d+(?:\.\d+)?)\s*(kg|g|グラム)/);
    if(gm){const grams=gm[2]==="kg"?+gm[1]*1000:+gm[1];mult=grams/(f.g||100);}
    else{
      const nm=part.match(/(\d+(?:\.\d+)?)\s*(個|枚|杯|本|切れ|パック|缶|袋|皿|人前|玉|食|貫|尾|合|切|房)/);
      if(nm)mult=+nm[1];
      else{const xm=part.match(/[×xX](\d+(?:\.\d+)?)/);if(xm)mult=+xm[1];else if(/半分/.test(part))mult=0.5;}
    }
    const r2=v=>Math.round(v*mult*10)/10;
    items.push({name:f.n+(mult!==1?" ×"+(Math.round(mult*100)/100):""),calories:Math.round(f.k*mult),protein:r2(f.p),fat:r2(f.f),carb:r2(f.c),unit:f.u});
  });
  return{items,unknown};
}

function getMealHistory(){
  const seen=new Set();
  const list=[];
  Object.entries(S.days).sort((a,b)=>b[0]>a[0]?1:-1).forEach(([,d])=>{
    (d.meals||[]).forEach(m=>{
      const key=m.name.trim();
      if(!seen.has(key)){
        seen.add(key);
        list.push(m);
      }
    });
  });
  return list;
}

function init(){
  const p=LS.load("bn_profile");if(p)S.profile=p;
  if(S.profile.activity==="0.9")S.profile.activity="1.2";
  const k=LS.load("bn_apikey");if(k)S.apiKey=k;
  const d=LS.load("bn_days");if(d){S.days=d;if(d[dk]?.weight)S.todayW=d[dk].weight;}
  const c=LS.load("bn_chat");if(c)S.chat=c;
  // iPhoneショートカットからの取り込み（?w=体重kg&steps=歩数&kcal=消費kcal&bf=体脂肪率%）
  try{
    const q=new URLSearchParams(location.search);
    const hw=parseFloat(q.get("w"));const hs=parseInt(q.get("steps"));const hk=parseFloat(q.get("kcal"));const hb=parseFloat(q.get("bf"));
    if(hw>0||hs>0||hk>0||hb>0){
      const msgs=[];
      if(hw>0){
        S.todayW=String(hw);
        mutDay(dk,d=>({...d,weight:String(hw)}));
        if(!S.profile.weight)updateProfile("weight",String(hw));
        msgs.push(`体重${hw}kg`);
      }
      if(hb>0&&hb<100){
        const bv=Math.round(hb*10)/10;
        mutDay(dk,d=>({...d,bf:String(bv)}));
        msgs.push(`体脂肪率${bv}%`);
      }
      if(hs>0&&!(hk>0)){
        const kg=+S.profile.weight||55;
        const kcal=Math.round(hs*0.0007*kg*0.75);
        mutDay(dk,d=>{
          const ex=d.exercises.filter(e=>e.type!=="歩数（ヘルスケア）");
          ex.push({type:"歩数（ヘルスケア）",minutes:"",calories:kcal,time:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})});
          return{...d,exercises:ex};
        });
        msgs.push(`${hs.toLocaleString()}歩`);
      }
      if(hk>0){
        mutDay(dk,d=>{
          const ex=d.exercises.filter(e=>e.type!=="消費カロリー（ヘルスケア）"&&e.type!=="歩数（ヘルスケア）");
          ex.push({type:"消費カロリー（ヘルスケア）",minutes:"",calories:Math.round(hk),time:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})});
          return{...d,exercises:ex};
        });
        msgs.push(`消費${Math.round(hk)}kcal`);
      }
      S.healthMsg="ヘルスケアから取り込みました："+msgs.join("・");
      history.replaceState(null,"",location.pathname);
    }
  }catch(e){}
  render();
}

function pfcCard(pi,fi,ci,tc){
  if(!tc) return "";
  const tP=S.profile.weight?Math.round(+S.profile.weight*1.6):60;
  const tF=Math.round(tc*0.25/9);
  const tC=Math.round((tc-tP*4-tF*9)/4);
  if(pi===0&&fi===0&&ci===0){
    return `<div class="card cg"><div class="lbl">今日の目標PFC</div><div class="pfcr">
    ${[["🥩 P",tP,"g","#6BCB77"],["🧈 F",tF,"g","#FF9A3C"],["🍚 C",tC,"g","#4D96FF"]].map(([lb,vl,unit,cl])=>`<div class="pfci" style="background:${cl}18"><div style="font-size:10px;color:${cl};font-weight:700">${lb}</div><div style="font-size:16px;font-weight:900;color:${cl}">${vl}${unit}</div></div>`).join("")}
    </div></div>`;
  }
  const r1=x=>Math.round(x*10)/10;
  pi=r1(pi);fi=r1(fi);ci=r1(ci);
  const lP=r1(Math.max(tP-pi,0)),lF=r1(Math.max(tF-fi,0)),lC=r1(Math.max(tC-ci,0));
  return `<div class="card cg"><div class="lbl">PFC　今日 vs 目標</div><div class="pfcr">
  ${[["🥩 P",pi,tP,"#6BCB77"],["🧈 F",fi,tF,"#FF9A3C"],["🍚 C",ci,tC,"#4D96FF"]].map(([lb,cur,tgt,cl])=>{
    const pct=Math.min(Math.round(cur/tgt*100),100);
    return `<div class="pfci" style="background:${cl}18">
      <div style="font-size:10px;color:${cl};font-weight:700">${lb}</div>
      <div style="font-size:13px;font-weight:900;color:${cl}">${cur}<span style="font-size:9px">/${tgt}g</span></div>
      <div style="background:#eee;border-radius:4px;height:5px;margin:3px 0"><div style="background:${cl};width:${pct}%;height:5px;border-radius:4px"></div></div>
      <div style="font-size:10px;color:${cl}">あと${r1(Math.max(tgt-cur,0))}g</div>
    </div>`;
  }).join("")}
  </div>
  ${lP>0||lF>0||lC>0?`<div style="margin-top:6px">
    ${lP>0?`<div style="font-size:11px;color:#555;padding:3px 0">🥩 あと${lP}g → 鶏むね肉${Math.round(lP/0.23)}g・卵${Math.round(lP/6.2)}個</div>`:""}
    ${lF>0?`<div style="font-size:11px;color:#555;padding:3px 0">🧈 あと${lF}g → アボカド${Math.round(lF/0.173)}g・くるみ${Math.round(lF/0.65)}g</div>`:""}
    ${lC>0?`<div style="font-size:11px;color:#555;padding:3px 0">🍚 あと${lC}g → ご飯${Math.round(lC/0.37)}g・バナナ${Math.round(lC/22.5)}本</div>`:""}
  </div>`:`<div style="text-align:center;font-size:12px;color:#6BCB77;font-weight:700;padding:4px">🎉 PFC目標達成！</div>`}
  </div>`;
}

// ── グラフ ──
function tabGraph(){
  const entries=Object.entries(S.days).sort((a,b)=>a[0]>b[0]?1:-1).slice(-(S.graphRange||7));
  if(entries.length<2)return `<div style="text-align:center;color:#888;font-size:14px;margin-top:40px">2日以上記録するとグラフが表示されます</div>`;
  const wd=entries.map(([k,d])=>({date:k.slice(5),w:d.weight?+d.weight:null,in:d.meals?.reduce((s,m)=>s+(+m.calories||0),0)||0,out:d.exercises?.reduce((s,e)=>s+(+e.calories||0),0)||0,sl:d.sleep?.hours?+d.sleep.hours:null}));
  function lineSvg(data,key,color){
    const pts=data.map((d,i)=>d[key]!==null?{i,v:d[key]}:null).filter(Boolean);
    if(!pts.length)return `<div style="text-align:center;color:#888;font-size:12px;padding:20px">データなし</div>`;
    const W=320,H=90,px=24;
    const xs=data.map((_,i)=>px+i*(W-px*2)/(data.length-1));
    const vs=pts.map(p=>p.v);
    const mn=Math.min(...vs),mx=Math.max(...vs),rng=mx-mn||1;
    const py=v=>H-px-((v-mn)/rng)*(H-px*2);
    const path=pts.map((p,j)=>`${j===0?"M":"L"}${xs[p.i].toFixed(1)},${py(p.v).toFixed(1)}`).join(" ");
    const dots=pts.map(p=>`<circle cx="${xs[p.i].toFixed(1)}" cy="${py(p.v).toFixed(1)}" r="4" fill="${color}"/><text x="${xs[p.i].toFixed(1)}" y="${(py(p.v)-8).toFixed(1)}" text-anchor="middle" font-size="9" fill="${color}">${p.v}</text>`).join("");
    const xlb=data.map((d,i)=>`<text x="${xs[i].toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#aaa">${d.date}</text>`).join("");
    return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible"><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xlb}</svg>`;
  }
  function barSvg(data){
    const W=320,H=90,px=24;
    const mv=Math.max(...data.map(d=>Math.max(d.in,d.out)),1);
    const bw=(W-px*2)/(data.length*2.8);
    return `<svg width="100%" viewBox="0 0 ${W} ${H}">${data.map((d,i)=>{
      const x=px+i*(W-px*2)/data.length;
      const ih=(d.in/mv)*(H-px*2);const oh=(d.out/mv)*(H-px*2);
      return `<rect x="${x.toFixed(1)}" y="${(H-px-ih).toFixed(1)}" width="${bw.toFixed(1)}" height="${ih.toFixed(1)}" fill="#FF9A3C" rx="2"/>
<rect x="${(x+bw+2).toFixed(1)}" y="${(H-px-oh).toFixed(1)}" width="${bw.toFixed(1)}" height="${oh.toFixed(1)}" fill="#FF6B6B" rx="2"/>
<text x="${(x+bw).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#aaa">${d.date}</text>`;
    }).join("")}</svg>`;
  }
  return `<div style="display:flex;gap:6px;margin-bottom:10px">${[7,30].map(r=>`<button class="ab${(S.graphRange||7)===r?" on":""}" onclick="S.graphRange=${r};renderContent()">${r}日間</button>`).join("")}</div><div class="card cg"><div class="lbl">体重推移（kg）</div>${lineSvg(wd,"w","#6BCB77")}</div>
<div class="card cl"><div class="lbl">カロリー（kcal）</div><div style="display:flex;gap:12px;font-size:11px;margin-bottom:6px"><span style="color:#FF9A3C">■ 摂取</span><span style="color:#FF6B6B">■ 消費</span></div>${barSvg(wd)}</div>
<div class="card cb"><div class="lbl">睡眠時間（時間）</div>${lineSvg(wd,"sl","#4D96FF")}</div>`;
}

async function onPhoto(input,quick){
  const files=Array.from(input.files||[]);input.value="";if(!files.length)return;
  syncInputs();
  let urls=[];
  try{
    urls=await Promise.all(files.map(f=>readFile(f)));
    S.imgData=[...S.imgData,...urls];
  }catch(e){console.error(e);renderContent();return;}
  if(!S.apiKey||!urls.length){renderContent();return;}
  S.imgBusy=true;S.photoAnalysis=null;renderContent();
  try{
    const blocks=[];
    urls.slice(0,3).forEach(u=>{
      const mt=String(u).match(/^data:([^;]+);base64,(.*)$/);
      if(mt)blocks.push({type:"image",source:{type:"base64",media_type:mt[1],data:mt[2]}});
    });
    blocks.push({type:"text",text:"この食事の写真を見て、写っている食品を推定し、それぞれのカロリーとPFC（タンパク質・脂質・炭水化物）を推定してください。量は写真の見た目から一般的な1人前で見積もってください。最後に、この食事で不足しがちな栄養素と、足すといい食品を1つ挙げてください。"});
    const raw=await apiVision(blocks);
    const match=raw.match(/\{[\s\S]*\}/);
    const parsed=JSON.parse(match[0]);
    if(!parsed.foods||!parsed.foods.length)throw new Error("empty");
    const sum=k=>Math.round(parsed.foods.reduce((x,f)=>x+(+f[k]||0),0)*10)/10;
    const tot={calories:Math.round(parsed.foods.reduce((x,f)=>x+(+f.calories||0),0)),protein:sum("protein"),fat:sum("fat"),carb:sum("carb")};
    S.photoAnalysis={lines:parsed.foods.slice(0,6).map(f=>`・${f.name}: ${f.calories}kcal P:${f.protein}g F:${f.fat}g C:${f.carb}g`),shortage:parsed.shortage||null};
    if(parsed.name&&!S.mealName.trim())S.mealName=String(parsed.name).slice(0,30);
    S.calcResult={...tot,detail:(parsed.comment||"写真判定").slice(0,150)};
    if(quick)quickSave();
  }catch(e){
    console.error(e);
    S.photoAnalysis={lines:["写真の判定に失敗しました。写真は記録として添付されています。"],shortage:null};
  }
  S.imgBusy=false;renderContent();
}

// 写真判定専用のAPI呼び出し（安いモデルを使用）
async function apiVision(blocks){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-4-5",max_tokens:1024,
      system:'あなたは栄養管理の専門家です。必ずJSONのみで回答してください。形式:{"name":"料理名を一言","comment":"全体の印象を1文","foods":[{"name":"食品名","calories":数値,"protein":数値,"fat":数値,"carb":数値}],"shortage":"不足しがちな栄養素と足すといい食品"}',
      messages:[{role:"user",content:blocks}]})});
  if(!res.ok)throw new Error("API "+res.status);
  const data=await res.json();
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
}

  const match=raw.match(/\{[\s\S]*\}/);

  const tot={calories:Math.round(parsed.foods.reduce((x,f)=>x+(+f.calories||0),0)),protein:sum("protein"),fat:sum("fat"),carb:sum("carb")};
  S.photoAnalysis={lines:parsed.foods.slice(0,6).map(f=>`・${f.name}: ${f.calories}kcal P:${f.protein}g F:${f.fat}g C:${f.carb}g`),shortage:parsed.shortage||null};
  S.calcResult={...tot,detail:("AI推定: "+(parsed.comment||"メニュー名から推定")).slice(0,150)};

// 計算結果へのコメント（数字だけから作る。食材の推測はしない）
function mealComment(cr){
  const kcal=cr.calories||0, p=cr.protein||0, f=cr.fat||0, c=cr.carb||0;
  if(kcal<=10) return "カロリーはほぼゼロです。そのまま記録して大丈夫です。";
  const pr=kcal? (p*4/kcal) : 0, fr=kcal? (f*9/kcal) : 0, crb=kcal? (c*4/kcal) : 0;
  const msgs=[];
  if(p>=25||pr>=0.25) msgs.push("タンパク質がしっかり摂れています");
  if(fr>=0.40) msgs.push("脂質が多めです。次の食事はあっさりめがおすすめです");
  if(crb>=0.65&&p<15) msgs.push("炭水化物が中心です。タンパク質のおかずを足すとバランスが良くなります");
  if(kcal>=700) msgs.push("ボリュームのある一食です");
  if(kcal<=350&&p>=15) msgs.push("軽めでもタンパク質が摂れていていいです");
  if(!msgs.length) msgs.push("バランスの取れた一食です");
  return msgs.slice(0,2).join("。")+"。";
}

function calcCal(){
const mn=document.getElementById("iMN");if(mn)S.mealName=mn.value;
const mo=document.getElementById("iMo");if(mo)S.mealNote=mo.value;
if(!S.mealName.trim()){alert("メニュー名を入力してください");return;}
let src=S.mealName;
let res=parseMeal(src);
if(!res.items.length&&S.mealNote){res=parseMeal(S.mealNote);src=S.mealNote;}
if(!res.items.length){
if(S.apiKey){aiEstimateMeal(src);return;}
S.calcResult={error:"内蔵データに見つかりませんでした。食品名を分けて書くか（例：ご飯、納豆、味噌汁）、追加後に「編集」で数値を直接入れてください。設定でAPIキーを入れると、メニュー名のままでもAIが推定できるようになります。"};
renderContent();return;
}
const sum=k=>Math.round(res.items.reduce((x,i)=>x+i[k],0)*10)/10;
const detail=res.items.map(i=>`${i.name}(${i.unit}):${i.calories}kcal`).join(" / ").slice(0,150)+(res.unknown.length?` ※未対応: ${res.unknown.join("、")}`:"");
S.calcResult={calories:Math.round(res.items.reduce((x,i)=>x+i.calories,0)),protein:sum("protein"),fat:sum("fat"),carb:sum("carb"),detail};
renderContent();
}

function getAdvice(){
const td=getDay(dk);
const ki=td.meals.reduce((x,m)=>x+(+m.calories||0),0);
const ko=td.exercises.reduce((x,e)=>x+(+e.calories||0),0);
const dp=Math.round(td.meals.reduce((x,m)=>x+(+m.protein||0),0)*10)/10;
const df=Math.round(td.meals.reduce((x,m)=>x+(+m.fat||0),0)*10)/10;
const dc=Math.round(td.meals.reduce((x,m)=>x+(+m.carb||0),0)*10)/10;
const bmr=S.profile.height&&S.profile.weight&&S.profile.age?Math.round(655+9.6*+S.profile.weight+1.8*+S.profile.height-4.7*+S.profile.age):null;
const tdee=bmr?Math.round(bmr*(+S.profile.activity||1.375)):null;
const wl=S.profile.goal&&S.profile.weeks&&S.profile.weight?Math.max((+S.profile.weight-+S.profile.goal)/+S.profile.weeks,0):0;
const tc=tdee?Math.max(tdee-Math.round(wl*7700/7),1200):null;
const tP=S.profile.weight?Math.round(+S.profile.weight*1.6):60;
const L=[];
L.push("");
if(tc){
if(ki===0)L.push("今日はまだ食事の記録がありません。まず1食入れてみましょう。");
else if(ki<=tc)L.push(`摂取${ki}kcalは目標${tc}kcal以内です。この調子でいきましょう。`);
else L.push(`摂取${ki}kcalで、目標${tc}kcalを${ki-tc}kcal超えています。1日で取り返そうとせず、明日少し抑えれば大丈夫です。`);
}else{
L.push("プロフィール（身長・体重・年齢・目標）を入れると、目標カロリーと比較できます。");
}
const pt=dp*4,ft=df*9,ct=dc*4,tt=pt+ft+ct;
if(tt>0){
const pp=Math.round(pt/tt*100),fp=Math.round(ft/tt*100),cp=Math.round(ct/tt*100);
L.push(`PFCバランスは P${pp}% / F${fp}% / C${cp}%（目標の目安 25 / 25 / 50）。`);
if(pp<20)L.push(`タンパク質が不足気味です（今日${dp}g、目標${tP}g）。サラダチキン・卵・納豆・ヨーグルトが手軽です。`);
if(fp>35)L.push("脂質が多めです。揚げ物や脂身の多い肉を、魚や鶏むね肉に置き換えると収まります。");
if(cp<35)L.push("炭水化物が少なめです。極端に抜くと続かないので、ご飯は茶碗1杯を目安に残しましょう。");
if(pp>=20&&fp<=35&&cp>=35)L.push("PFCバランスは良好です。");
}
if(td.sleep){
L.push(+td.sleep.hours>=7?`睡眠${td.sleep.hours}時間、十分です。`:`睡眠${td.sleep.hours}時間は不足気味です。睡眠不足は食欲を増やすので、7時間を目指しましょう。`);
}
if(wl>1)L.push(`⚠️ 週${wl.toFixed(2)}kg減のペース設定は急激です。週0.5kg前後に落とすとリバウンドしにくくなります。`);
L.push("");
L.push("");
if(ko===0)L.push("軽い運動を1つだけ：10分の散歩か、VRを1本。それで十分です。");
else if(dp<tP*0.7)L.push("タンパク質を+1品（卵・納豆・ヨーグルトのどれか）足してみましょう。");
else L.push("今日の流れをそのまま明日も。記録を続けることが一番効きます。");
S.advice=L.join("\n");renderContent();
}

// pastAdd
function paOpen(k){S.pastAdd[k]={open:true,name:"",note:"",timing:"朝",result:null,loading:false};renderContent();}
function paClose(k){S.pastAdd[k]={open:false};renderContent();}
function paSetT(k,t){syncInputs();S.pastAdd[k].timing=t;renderContent();}
function paSetR(k,r){S.pastAdd[k].result=r;renderContent();}
function paCalc(k){
syncInputs();
const pa=S.pastAdd[k];if(!pa.name.trim())return;
const res=parseMeal(pa.name);
if(!res.items.length){pa.result={error:"内蔵データに見つかりませんでした"};renderContent();return;}
const sum=key=>Math.round(res.items.reduce((x,i)=>x+i[key],0)*10)/10;
pa.result={calories:Math.round(res.items.reduce((x,i)=>x+i.calories,0)),protein:sum("protein"),fat:sum("fat"),carb:sum("carb")};
renderContent();
}
function paConfirm(k){
  syncInputs();
  const pa=S.pastAdd[k];if(!pa.result||pa.result.error)return;
  mutDay(k,d=>({...d,meals:[...d.meals,{name:pa.name.trim(),calories:pa.result.calories,protein:pa.result.protein||0,fat:pa.result.fat||0,carb:pa.result.carb||0,timing:pa.timing,time:"過去記録",photo:null}]}));
  paClose(k);
}

init();
</script>
